services:
  db:
    image: postgres:16-alpine
    container_name: pocketprint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pocketprint
      POSTGRES_USER: ${POSTGRES_USER:-pocketprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocketprint} -d pocketprint"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pocketprint-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pocketprint-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pocketprint}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@db:5432/pocketprint
      SECRET_KEY: ${POCKETPRINT_SECRET:?Set POCKETPRINT_SECRET to a random secret of at least 32 characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to your HTTPS dashboard origin}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS to your backend hostnames}
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE: 52428800
      JOB_LEASE_SECONDS: 120
      DEVICE_ONLINE_TIMEOUT_SECONDS: 90
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - document_storage:/app/storage
    ports:
      - "8000:8000"
    networks:
      - pocketprint-net

volumes:
  postgres_data:
  document_storage:

networks:
  pocketprint-net:
    driver: bridge
